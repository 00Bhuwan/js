<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process bar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        header {
            height: 122px;
            background-color: black;
            color: white;
            display: flex;
            align-items: end;
        }
        .progress {
            background-color: red;
            height: 8px;
            /* animation-name: progressBar; */
            animation: progressBar 1.5s ease-out 1;
        }
        main {
            height: 80vh;
            background-color: gray;
        }
        /* @keyframes progressBar {
            0% {
                width: 0;
            }
            50% {
                width: 70vw;
            }
            100% {
                width: 100vw;
            }
        } */
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(180deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        img {
            display: block;
            margin: auto;
        }
        .slider {
            background-color: white;
            height: 523px;
            overflow: hidden;
            margin: auto;
            display: flex;
            justify-content: center;
        }
        .img1 {
            transform: translate(-18vw);
            animation: sliding1 2s 1s forwards 5;
        }
        .img2 {
            transform: translate(0vw);
            animation: sliding2 2s 1s forwards 5;
        }
        .img3 {
            transform: translate(18vw);
            /* animation: sliding3 2s 1s forwards 5; */
        }
        @keyframes sliding1 {
            0% {
                transform: translate(-18vw);
            }
            100% {
                transform: translate(68vw);
            }
        }
        @keyframes sliding2 {
            0% {
                transform: translate(0vw);
            }
            100% {
                transform: translate(84vw);
            }
        }
        @keyframes sliding3 {
            0% {
                transform: translate(18vw);
            }
            100% {
                transform: translate(-68vw);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="progress"></div>
    </header>
    <main>
        <!-- <img src="https://plus.unsplash.com/premium_photo-1683121396838-5d1129305221?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="balbla" width="250px" height="180px"> -->
         <div class="slider">
                    <img class="img1" src="https://plus.unsplash.com/premium_photo-1683121396838-5d1129305221?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="balbla">
                    <img src="https://images.unsplash.com/photo-1780321100374-f10cd7172e77?q=80&w=871&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="img2" class="img2">
                    <img src="https://images.unsplash.com/photo-1781808314914-5059d7367775?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="asd" class="img3">
         </div>
    </main>
</body>
</html>
