<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        header{
            background-color: rgb(60, 172, 172);
        }
        li{
            display: inline;
        }
        .container{
            background-color: azure;
            height: 50vh;
            width: 50vw;
            margin: auto;
        }
        p{
            text-align: center;
            border: 2px solid red;
        }
        .box{
            width: 250px;
            height: 50px; 
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <p>
            Lorem ipsum dolor sit, amet consectetur adipisicing elit. Autem rerum unde a.
        </p>
        <div class="box">This is a box.</div>
    </div>
</body>
</html>
