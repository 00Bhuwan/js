<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Using Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header {
            background-color: rgb(168, 164, 164);
            color: black;
            height: 15vh;
            align-content: center;
        }
        ul {
            display: inline-grid;
            list-style: none;
            grid-template-columns: auto auto;
        }
        li {
            margin: 0 23px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
            </ul>
        </nav>
    </header>
    <div class="container">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Quo, ex?
    </div>
</body>
</html>
