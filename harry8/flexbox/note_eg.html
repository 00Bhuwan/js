<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .one{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;    
            /* flex-wrap accomodate items inside the container. */

            /* flex-flow: column wrap; */


        }
        .first{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            margin: 12px;
        }
        .two{
            border: 1px solid red;
            padding: 0;
            list-style: none;
            background-color: #e8e8e9;
            display: flex;
            /* justify-content: space-between; */
        }
        .second{
            background-color: #8ceaa0;
            width: 100px;
            height: 100px;
            border: 2px solid black;
            /* margin: 8px;
            padding: 4px; */
            flex: 2 1 0 ;
        }
        .second-third{
            background-color: red;
            height: 50px;
            width: 50px;
            flex-basis: 1;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <ul class="one">
        <li class="first">23</li>
        <li class="first"></li>
        <li class="first"></li>
        <li class="first"></li>
        <li class="first">12</li>
    </ul>

    <ul class="two">
        <li class="second">21</li>
        <li class="second">Lorem ipsum dolor sit amet consectetur
             adipisicing elit. Ratione totam fugiat nihil.</li>
        <li class="second-third">text</li>
        <li class="second">34</li>
    </ul>
</body>
</html>
