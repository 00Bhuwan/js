<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        ul{
            display: flex;
            list-style: none;
        }
        li{
            flex: 0 0 auto;
        }
        li:nth-child(1) {
            margin-right: auto; /*applied only to the right*/
        }
    </style>
</head>
<body>
    <ul>
    <li>Branding</li>
    <li>Home</li>
    <li>Services</li>
    <li>About</li>
    <li>Contact</li>
</ul>
<div>
    <p>When you use the auto-margin alignment on
         a flex-item, the justify-content property
          no longer works.</p>
</div>
</body>
</html>
