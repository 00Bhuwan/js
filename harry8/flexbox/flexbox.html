<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 50vh;
            border: 5px solid black;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;  
            align-items: center;
            /* align items and align cont ent have same value but differ for elements with gaps */
        }
        .box1 {
            height: 100px;
            width: 100px;
            background-color: rgb(163, 31, 31);
            /* float: left; */
            border: 3px solid black;
        }
        .box2 {
            height: 100px;
            width: 100px;
            background-color: blue;
            /* float: left; */
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box1"></div>
        <div class="box1"></div>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box2"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
