<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul {
            padding: 34px;
        }

        li {
            list-style: none;
            display: inline;
            padding: 0 43px;
        }

        header {
            background-color: black;
            color: white;
            height: 90px;
        }

        .container {
            display: flex;
            justify-content: space-between;
        }

        .left {
            height: 70vh;
            width: 40vw;
            background-color: silver;
        }

        .right {
            height: 70vh;
            width: 40vw;
            background-color: goldenrod;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="left">Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusamus aperiam earum nihil?</div>
        <div class="right">Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusamus aperiam earum nihil?</div>
    </div>
</body>

</html>
